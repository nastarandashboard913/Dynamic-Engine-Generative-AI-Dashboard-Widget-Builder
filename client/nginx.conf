server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # Client-side routing: unknown paths resolve to the SPA shell, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets are immutable — cache them hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ---------------------------------------------------------------------------
  # API proxy.
  #
  # The buffering directives below are load-bearing, not boilerplate. nginx
  # defaults to buffering an upstream response until it is complete, which would
  # collapse the SSE dashboard stream into a single blob delivered at the end —
  # every widget would appear at once and the progressive-rendering behaviour
  # this app is built around would be invisible.
  # ---------------------------------------------------------------------------
  location /api/ {
    proxy_pass http://server:8787;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Clear the default "close" so the connection stays open for the stream.
    proxy_set_header Connection        '';

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # An idle SSE connection must not be reaped mid-stream.
    proxy_read_timeout 1h;
    send_timeout       1h;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
